AWSTemplateFormatVersion: "2010-09-09"
Parameters:
  DomainName:
    Type: String
    Description: The custom domain name under which the Express service is available.
    Default: mydomain.com
  ListenerArn:
    Type: String
    Description: ARN of the ECS Express managed HTTPS listener.
  LoadBalancerArn:
    Type: String
    Description: ARN of the ECS Express managed Application Load Balancer.
  CertificateArn:
    Type: String
    Description: ACM certificate ARN covering the custom domain.
  DNSDomainId:
    Type: String
    Description: The ID of the Route53 Hosted Zone for the custom domain.

Resources:
  # Alias A-record pointing the custom domain at the Express-managed ALB.
  CustomDomainAliasRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      Comment: To REDCap ECS Express managed ALB
      HostedZoneId: !Ref DNSDomainId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt EcsExpressCustomDomain.LoadBalancerDNSName
        HostedZoneId: !GetAtt EcsExpressCustomDomain.LoadBalancerHostedZoneId
        EvaluateTargetHealth: false

  # Custom resource that attaches the ACM certificate and a host-header rule
  # for the custom domain to the Express-managed HTTPS listener. It re-asserts
  # the configuration on every deploy, which mitigates the drift caused by
  # UpdateExpressGatewayService reverting out-of-band ALB changes.
  EcsExpressCustomDomain:
    Type: Custom::EcsExpressCustomDomain
    Properties:
      ServiceToken: !GetAtt EcsExpressCustomDomainProvider.Arn
      ListenerArn: !Ref ListenerArn
      LoadBalancerArn: !Ref LoadBalancerArn
      CertificateArn: !Ref CertificateArn
      DomainName: !Ref DomainName

  EcsExpressCustomDomainProvider:
    Type: AWS::Lambda::Function
    Properties:
      Description: Custom::EcsExpressCustomDomain provider - attaches a custom domain to an ECS Express managed ALB
      Handler: index.handler
      MemorySize: 128
      Timeout: 300
      Role: !GetAtt "LambdaRole.Arn"
      Runtime: python3.13
      Code:
        ZipFile: |
          import json
          import logging
          from urllib.request import urlopen, Request

          import boto3
          from botocore.exceptions import ClientError

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          RULE_TAG_KEY = "redcap:express-custom-domain"


          class EcsExpressCustomDomainProvider:
              """
              Attaches an ACM certificate and a host-header listener rule for a
              custom domain to the Application Load Balancer that ECS Express Mode
              provisions and manages. Also exposes the ALB DNS name / hosted zone
              so the caller can create a Route53 alias record.
              """

              def __init__(self, elbv2=None):
                  self.elbv2 = elbv2 or boto3.client("elbv2")

              # -- helpers -------------------------------------------------------

              def _describe_load_balancer(self, load_balancer_arn):
                  resp = self.elbv2.describe_load_balancers(
                      LoadBalancerArns=[load_balancer_arn]
                  )
                  return resp["LoadBalancers"][0]

              def _default_target_group_arn(self, listener_arn):
                  # The Express listener's default action forwards to the managed
                  # target group; reuse it for the custom-domain host rule.
                  listener = self.elbv2.describe_listeners(
                      ListenerArns=[listener_arn]
                  )["Listeners"][0]
                  for action in listener.get("DefaultActions", []):
                      if action.get("Type") == "forward":
                          if action.get("TargetGroupArn"):
                              return action["TargetGroupArn"]
                          tgs = action.get("ForwardConfig", {}).get("TargetGroups", [])
                          if tgs:
                              return tgs[0]["TargetGroupArn"]
                  raise RuntimeError(
                      "Could not determine default target group for listener"
                  )

              def _existing_domain_rule(self, listener_arn, domain_name):
                  rules = self.elbv2.describe_rules(ListenerArn=listener_arn)["Rules"]
                  for rule in rules:
                      for cond in rule.get("Conditions", []):
                          values = cond.get("HostHeaderConfig", {}).get("Values", [])
                          if cond.get("Field") == "host-header" and domain_name in values:
                              return rule
                  return None

              def _next_priority(self, listener_arn):
                  rules = self.elbv2.describe_rules(ListenerArn=listener_arn)["Rules"]
                  used = set()
                  for rule in rules:
                      prio = rule.get("Priority")
                      if prio and prio.isdigit():
                          used.add(int(prio))
                  priority = 1
                  while priority in used:
                      priority += 1
                  return priority

              # -- lifecycle -----------------------------------------------------

              def upsert(self, props, response):
                  listener_arn = props["ListenerArn"]
                  certificate_arn = props["CertificateArn"]
                  domain_name = props["DomainName"]
                  load_balancer_arn = props["LoadBalancerArn"]

                  # 1. Attach the ACM certificate to the managed HTTPS listener
                  #    (idempotent - AddListenerCertificates is a no-op if present).
                  self.elbv2.add_listener_certificates(
                      ListenerArn=listener_arn,
                      Certificates=[{"CertificateArn": certificate_arn}],
                  )

                  # 2. Ensure a host-header rule for the custom domain exists,
                  #    forwarding to the managed default target group. The default
                  #    endpoint keeps working via the listener's existing rules.
                  target_group_arn = self._default_target_group_arn(listener_arn)
                  existing = self._existing_domain_rule(listener_arn, domain_name)
                  if existing is None:
                      self.elbv2.create_rule(
                          ListenerArn=listener_arn,
                          Priority=self._next_priority(listener_arn),
                          Conditions=[
                              {
                                  "Field": "host-header",
                                  "HostHeaderConfig": {"Values": [domain_name]},
                              }
                          ],
                          Actions=[
                              {"Type": "forward", "TargetGroupArn": target_group_arn}
                          ],
                          Tags=[{"Key": RULE_TAG_KEY, "Value": domain_name}],
                      )

                  # 3. Surface ALB DNS attributes for the Route53 alias record.
                  lb = self._describe_load_balancer(load_balancer_arn)
                  response["Data"] = {
                      "LoadBalancerDNSName": lb["DNSName"],
                      "LoadBalancerHostedZoneId": lb["CanonicalHostedZoneId"],
                  }
                  response["PhysicalResourceId"] = "{}|{}".format(
                      listener_arn, domain_name
                  )
                  response["Status"] = "SUCCESS"

              def delete(self, props, response):
                  # Best-effort cleanup: remove the host rule and detach the cert.
                  listener_arn = props.get("ListenerArn")
                  certificate_arn = props.get("CertificateArn")
                  domain_name = props.get("DomainName")
                  try:
                      rule = self._existing_domain_rule(listener_arn, domain_name)
                      if rule:
                          self.elbv2.delete_rule(RuleArn=rule["RuleArn"])
                      if certificate_arn:
                          self.elbv2.remove_listener_certificates(
                              ListenerArn=listener_arn,
                              Certificates=[{"CertificateArn": certificate_arn}],
                          )
                  except ClientError as error:
                      logger.error("ignoring delete error: %s", error)
                  response["Status"] = "SUCCESS"

              def handle(self, request):
                  response = {
                      "StackId": request["StackId"],
                      "RequestId": request["RequestId"],
                      "LogicalResourceId": request["LogicalResourceId"],
                      "Status": "SUCCESS",
                  }
                  if request.get("PhysicalResourceId"):
                      response["PhysicalResourceId"] = request["PhysicalResourceId"]

                  request_type = request.get("RequestType")
                  props = request.get("ResourceProperties", {})
                  try:
                      if request_type in ("Create", "Update"):
                          self.upsert(props, response)
                      elif request_type == "Delete":
                          self.delete(props, response)
                      else:
                          response["Status"] = "FAILED"
                          response["Reason"] = f"unknown request type {request_type}"
                  except Exception as error:  # noqa: BLE001
                      response["Status"] = "FAILED"
                      response["Reason"] = f"{request_type} failed: {error}"
                      logger.error("%s", response["Reason"])
                  return response


          def post_response_to_cloudformation(url: str, response: dict):
              data = json.dumps(response).encode("utf-8")
              logger.info("%s", data)
              put_request = Request(
                  url=url,
                  data=data,
                  headers={"Content-Length": str(len(data)), "Content-Type": ""},
                  method="PUT",
              )
              urlopen(put_request)


          def handler(request, _):
              provider = EcsExpressCustomDomainProvider()
              post_response_to_cloudformation(
                  request["ResponseURL"], provider.handle(request)
              )

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
      Policies:
        - PolicyName: ModifyExpressManagedAlbPermission
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeListeners
                  - elasticloadbalancing:DescribeRules
                  - elasticloadbalancing:AddListenerCertificates
                  - elasticloadbalancing:RemoveListenerCertificates
                  - elasticloadbalancing:CreateRule
                  - elasticloadbalancing:DeleteRule
                  - elasticloadbalancing:ModifyRule
                  - elasticloadbalancing:AddTags
                Resource:
                  - "*"
        - PolicyName: WriteToLogGroupPermission
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:CreateLogGroup
                Resource:
                  - "*"
