version: "0.2"
phases:
  install:
    commands:
      - "docker buildx inspect containerd >/dev/null 2>&1 || docker buildx create --name containerd --driver=docker-container --driver-opt default-load=true"
      - "docker buildx use containerd"
  pre_build:
    commands:
      - "aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
  build:
    commands:
      # Persistent Docker layer cache in Amazon ECR (tag: buildcache).
      - "docker buildx build --builder=containerd --provenance=false --cache-from type=registry,ref=$ECR_REPOSITORY_URI:buildcache --cache-to type=registry,ref=$ECR_REPOSITORY_URI:buildcache,mode=max,image-manifest=true,oci-mediatypes=true --build-arg LANG_S3_URI=$LANG_S3_URI --build-arg REDCAP_S3_URI=$REDCAP_S3_URI --build-arg AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION --build-arg PORT=$PORT --build-arg AWS_CONTAINER_CREDENTIALS_RELATIVE_URI=$AWS_CONTAINER_CREDENTIALS_RELATIVE_URI -t $ECR_REPOSITORY_URI:$IMAGE_TAG -t $ECR_REPOSITORY_URI:latest --push ."
  post_build:
    commands:
      # The image (both tags) was already published by `buildx --push`.
      #
      # ECS Express has no ECR-push auto-deploy (unlike App Runner and ECS
      # Fargate).
      - |
        set -eu
        if [ -n "${EXPRESS_SERVICE_NAME:-}" ]; then
          CLUSTER="${EXPRESS_CLUSTER:-default}"
          SERVICE_ARN="arn:aws:ecs:${AWS_DEFAULT_REGION}:${AWS_ACCOUNT_ID}:service/${CLUSTER}/${EXPRESS_SERVICE_NAME}"

          DIGEST=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY_NAME" \
            --image-ids imageTag="$IMAGE_TAG" --region "$AWS_DEFAULT_REGION" \
            --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)

          SVC=$(aws ecs describe-express-gateway-service --service-arn "$SERVICE_ARN" \
            --region "$AWS_DEFAULT_REGION" 2>/dev/null || true)

          if [ -z "$SVC" ]; then
            echo "Express service not found yet (first deploy); skipping roll."
          elif [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
            echo "Could not resolve image digest; skipping roll."
          else
            NEW_IMAGE="${ECR_REPOSITORY_URI}@${DIGEST}"
            CONTAINER=$(echo "$SVC" | jq -c \
              --arg image "$NEW_IMAGE" \
              '.service.activeConfigurations[0].primaryContainer | .image = $image')
            if [ -z "$CONTAINER" ] || [ "$CONTAINER" = "null" ]; then
              echo "Express service has no active primaryContainer; skipping roll."
            else
              echo "Rolling ECS Express service to $NEW_IMAGE"
              aws ecs update-express-gateway-service --service-arn "$SERVICE_ARN" \
                --region "$AWS_DEFAULT_REGION" --primary-container "$CONTAINER"
            fi
          fi
        fi
